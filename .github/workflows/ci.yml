name: ci

# Every push/PR: typecheck, the full test suite (including the DB-backed
# trust-integrity regressions) against a real Postgres, and a production
# build. TZ is pinned west of UTC so the date-rendering regression can never
# silently return.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # ECR Public mirror of the official image — Docker Hub pulls from CI
        # runners hit rate limits/outages (a registry timeout failed a run).
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: disclosure_ledger_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/disclosure_ledger_test
      TZ: America/Denver
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Apply schema (committed migrations)
        run: npx tsx src/db/migrate.ts

      - name: Unit + integration tests
        run: npx vitest run

      - name: Production build
        run: npm run build
