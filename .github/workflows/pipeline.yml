name: ingestion-pipeline

# Daily civic-data ingestion pipeline. Runs on GitHub Actions rather than
# Vercel: a public repo gets unlimited free CI minutes, full Linux VMs (so
# Tesseract / pdfplumber "just work"), and no function-duration ceiling.

# Cadence: one daily run. Discovery is a cheap, idempotent HTTP poll, and the
# parse stage only processes filings not seen before — so a daily run catches
# new 278-T trade filings within a day of posting (they need only appear once;
# late filings beyond the 45-day window are caught whenever they post) AND
# pulls each day's new statements. A single daily job is simpler and more
# reliable than separate trade/statement cadences.
on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC daily
  workflow_dispatch: {} # manual trigger

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Surya OCR of a large new filing is CPU-bound; the OCR cache makes
    # subsequent runs fast, but the first run (or a big new filing) needs room.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache OCR output + downloaded PDFs
        uses: actions/cache@v4
        with:
          path: |
            data/pdfs
            data/cache
          key: pipeline-data-${{ github.run_id }}
          restore-keys: pipeline-data-

      - name: Cache Surya OCR models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/datalab
            ~/.cache/huggingface
          key: surya-models-${{ hashFiles('pipeline/requirements.txt') }}
          restore-keys: surya-models-

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m venv pipeline/.venv
          pipeline/.venv/bin/pip install --upgrade pip
          pipeline/.venv/bin/pip install -r pipeline/requirements.txt

      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          RECONCILE_DATA_URL: ${{ secrets.RECONCILE_DATA_URL }}
          CRAWLER_USER_AGENT: "trump-stock-tracker civic-transparency project (contact: benjamin@opencivics.co)"
        run: npx tsx src/pipeline/run.ts all

      # Provenance durability: the actions/cache above is evictable (7-day
      # idle eviction, 10 GB repo cap) — never the only home of source PDFs.
      # Artifacts give a second, longer-lived copy of every raw filing.
      - name: Archive raw source PDFs (provenance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-pdfs-${{ github.run_id }}
          path: data/pdfs/
          if-no-files-found: ignore
          retention-days: 90

      - name: Trigger site revalidation
        if: success() && env.REVALIDATE_URL != ''
        env:
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
        run: curl -fsS "$REVALIDATE_URL" || true

      # FR-O4 — the daily pipeline alerts on failure. Default GH email is
      # easy to miss; a repo issue is visible and assignable.
      - name: Open an issue on pipeline failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Pipeline failure — $(date -u +%Y-%m-%d)"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq length)
          if [ "$existing" = "0" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --label pipeline-failure \
              --body "The scheduled ingestion run failed. See run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} — check \`ingestion_runs\` for the failing stage."
          fi
